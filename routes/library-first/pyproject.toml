[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covscreen-library-first"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["covalent-library-first>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../science/src"]
testpaths = ["tests"]
